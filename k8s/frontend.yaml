apiVersion: apps/v1
kind: Deployment
metadata:
  name: codex-frontend-deployment
  labels:
    app: codex-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: codex-frontend
  template:
    metadata:
      labels:
        app: codex-frontend
    spec:
      containers:
      - name: frontend
        image: ghcr.io/lcwolfconsulting/codex-hunter-frontend:latest
        ports:
        - containerPort: 80
        env:
        - name: DB_HOST
          value: "postgres-service"
---
apiVersion: v1
kind: Service
metadata:
  name: codex-frontend-service
spec:
  type: NodePort
  selector:
    app: codex-frontend
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
