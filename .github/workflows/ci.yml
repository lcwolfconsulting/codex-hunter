name: Codex Hunter - CI Pipeline

# Déclencheur : Le robot s'active à chaque fois qu'on fait un git push sur main
on:
  push:
    branches: [ "main" ]

jobs:
  check-code:
    name: Verification du code et des fichiers
    runs-on: ubuntu-latest # On demande un serveur virtuel Linux Ubuntu

    steps:
      - name: Recuperer le code du projet
        uses: actions/checkout@v4

      - name: Verifier la presence des fichiers
        run: |
          echo "=== Verification du projet Codex Hunter ==="
          ls -la
          echo "=== Verification des fichiers Terraform ==="
          ls -la terraform/
